<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짱짱이네 영어</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/zz-bear-180.png">
<link rel="icon" type="image/png" href="icons/zz-bear-192.png">
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--p:#18b98a;--pd:#0e9a71;--pl:#e2f7ef;--ink:#1d2433;--sub:#6b7385;--line:#e7eaf0;--bg:#eef1f6;--red:#ff5a5f;--redd:#d9393e;--redl:#ffeceb;--yel:#ffb800;--blue:#4b7bff;--purple:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#app{max-width:460px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
button{font-family:inherit;border:0;cursor:pointer;background:none;color:inherit;font-size:inherit}
.top{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);min-height:50px}
.top h1{font-size:16px;font-weight:900;flex:1;letter-spacing:-.3px}
.iconbtn{width:36px;height:36px;border-radius:10px;font-size:22px;display:grid;place-items:center}
.iconbtn:active{background:var(--bg)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--pl)}
.body{padding:14px;flex:1;display:flex;flex-direction:column;gap:11px}
.btn{width:100%;padding:13px;border-radius:14px;font-size:15px;font-weight:700;background:var(--p);color:#fff;box-shadow:0 4px 0 var(--pd);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pd)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--redd)}
.btn:disabled{opacity:.4;pointer-events:none}
.card{border:1.5px solid var(--line);border-radius:18px;padding:16px;background:#fff}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
/* profile */
.hero{text-align:center;padding:40px 18px 10px}
.hero .logo{font-size:52px}
.hero h2{font-size:26px;font-weight:900;margin-top:8px}
.plist{display:flex;justify-content:center;gap:18px;margin-top:30px}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.pbtn .face{width:86px;height:86px;border-radius:24px;display:grid;place-items:center;font-size:46px;border:3px solid transparent;transition:.15s}
.pbtn:active .face{transform:scale(.94)}
/* home tiles */
.greet{font-size:18px;font-weight:900;line-height:1.35}
.streakbar{display:flex;gap:10px}
.sbox{flex:1;border-radius:16px;padding:12px 14px;background:var(--bg)}
.sbox b{font-size:17px;font-weight:900;display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:18px;padding:14px;text-align:left;color:#fff;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.tile .em{font-size:26px}
.tile .nm{font-size:16px;font-weight:900}
.tile .ds{font-size:12px;opacity:.9}
.tile.off{filter:grayscale(.85);opacity:.55}
.tile .badge{position:absolute;top:12px;right:12px;font-size:11px;background:rgba(255,255,255,.3);padding:3px 8px;border-radius:20px;font-weight:700}
/* vocab home */
.lvseg{display:flex;background:var(--bg);border-radius:12px;padding:4px}
.lvseg button{flex:1;padding:7px;border-radius:9px;font-weight:700;font-size:14px;color:var(--sub)}
.lvseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.today{border-radius:18px;padding:16px;background:linear-gradient(135deg,#18b98a,#12a0a8);color:#fff}
.today h3{font-size:16px;font-weight:900}
.today .btn{background:#fff;color:var(--pd);box-shadow:0 4px 0 rgba(0,0,0,.15);margin-top:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:10px}
.cal .h{font-size:11px;color:var(--sub);font-weight:700}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:12px;color:var(--sub);background:var(--bg)}
.cal .d.st{background:var(--pl);font-size:18px}
.cal .d.td{outline:2px solid var(--p)}
.cal .d.e{background:none}
/* progress */
.prog{flex:1;height:12px;background:var(--bg);border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--p);border-radius:10px;transition:width .3s}
/* word card */
.wcard{flex:1;border:2px solid var(--line);border-radius:24px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;min-height:340px;cursor:pointer}
.wcard .w{font-size:36px;font-weight:900;letter-spacing:-.5px}
.wcard .pos{font-size:13px;color:var(--sub);font-weight:700}
.wcard .m{font-size:22px;font-weight:700;color:var(--pd)}
.wcard .ex{background:var(--bg);border-radius:14px;padding:14px;margin-top:8px;width:100%;text-align:left}
.wcard .ex p{font-size:16px;font-weight:500;line-height:1.5}
.wcard .ex span{font-size:13px;color:var(--sub)}
.spk{width:56px;height:56px;border-radius:50%;background:var(--pl);font-size:26px;display:grid;place-items:center}
.spk.big{width:110px;height:110px;font-size:52px}
.spk:active{transform:scale(.93)}
.hint{color:var(--sub);font-size:14px;font-weight:500}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--pl);color:var(--pd)}
.tag.rv{background:#fff3d6;color:#b07800}
/* quiz */
.qtitle{font-size:15px;font-weight:700;color:var(--sub)}
.qmain{font-size:26px;font-weight:900;text-align:center;padding:18px 6px;line-height:1.4}
.qsent{font-size:20px;font-weight:700;line-height:1.55;padding:18px;background:var(--bg);border-radius:18px}
.qsent u{text-decoration:none;display:inline-block;min-width:80px;border-bottom:3px solid var(--p);color:var(--p)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--line);border-radius:16px;padding:16px;font-size:17px;font-weight:600;text-align:left;box-shadow:0 3px 0 var(--line);background:#fff}
.opt:active{transform:translateY(2px)}
.opt.ok{border-color:var(--p);background:var(--pl);box-shadow:0 3px 0 var(--p)}
.opt.no{border-color:var(--red);background:var(--redl);box-shadow:0 3px 0 var(--red)}
.opt.dim{opacity:.45}
.sheet{position:sticky;bottom:0;padding:18px;border-top:1px solid var(--line);animation:up .2s ease}
.sheet.g{background:var(--pl)}
.sheet.r{background:var(--redl)}
.sheet h4{font-size:16px;font-weight:900;margin-bottom:4px}
.sheet.g h4{color:var(--pd)}
.sheet.r h4{color:var(--redd)}
.sheet p{font-size:14px;margin-bottom:12px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.mic{width:120px;height:120px;border-radius:50%;background:var(--p);color:#fff;font-size:54px;display:grid;place-items:center;margin:10px auto;box-shadow:0 6px 0 var(--pd)}
.mic.on{animation:pulse 1s infinite;background:var(--red);box-shadow:0 6px 0 var(--redd)}
@keyframes pulse{50%{transform:scale(1.07)}}
/* result */
.big{font-size:50px;text-align:center}
.rlist .it{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.rlist .it b{flex:1;font-size:16px}
.tabs{display:flex;gap:8px}
.tabs button{padding:8px 14px;border-radius:20px;font-weight:700;font-size:14px;background:var(--bg);color:var(--sub)}
.tabs button.on{background:var(--ink);color:#fff}
.empty{text-align:center;padding:50px 0;color:var(--sub)}
.stampPop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.note{font-size:12px;color:var(--sub);text-align:center}
.trophy{font-size:13px;font-weight:800;color:var(--blue);white-space:nowrap}
.qc{border:2px solid var(--line);border-radius:22px;overflow:hidden}
.qc .k{padding:14px 16px;font-size:16px;font-weight:700;line-height:1.5}
.qc .k .hl{color:var(--p)}
.qc .e{padding:14px 16px;background:#f7f8fb;font-size:17px;font-weight:700;line-height:2.1;border-top:1px solid var(--line)}
.bx{display:inline-block;height:42px;line-height:42px;border-radius:10px;background:#e4e8f0;vertical-align:middle;padding:0 10px;text-align:center;color:var(--ink);cursor:pointer;font-size:19px}
.bx.cur{box-shadow:inset 0 0 0 2px var(--blue)}
.bx.ok{background:var(--pl);color:var(--pd)}
.bx.no{background:var(--redl);color:var(--redd)}
.bx .hh{color:#a5adbd;letter-spacing:2px}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-2px)}50%{transform:translateX(2px)}75%{transform:translateX(-1px)}}
.blocks{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-content:flex-start;padding-top:2px}
.blk{padding:7px 12px;border:2px solid var(--line);border-radius:11px;font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--line);background:#fff}
.blk:active{transform:translateY(2px)}
.blk.used{display:none}
.blk{touch-action:none;user-select:none;-webkit-user-select:none}
.tinput{flex:1;padding:14px;border:2px solid var(--line);border-radius:14px;font-size:17px;font-family:inherit;outline:none}
.tinput:focus{border-color:var(--p)}
.toolbar{display:flex;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.toolbar button{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub)}
.toolbar button span{font-size:22px}
#sh{position:sticky;bottom:0;z-index:5}
#sh .sheet{position:absolute;left:0;right:0;bottom:0}
.toastm{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(29,36,51,.9);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.bxi{display:inline-block;vertical-align:middle;height:34px;border:0;border-radius:9px;background:#e4e8f0;padding:0 8px;margin:0 2px;font:inherit;font-size:16px;font-weight:800;color:var(--ink);outline:none;box-shadow:inset 0 0 0 2px var(--blue);text-align:center;max-width:100%}
.bxi::placeholder{color:#a5adbd;letter-spacing:1px}
.bxi.ok{background:var(--pl);color:var(--pd);box-shadow:none;opacity:1}
.bxi.no{background:var(--redl);color:var(--redd);box-shadow:none;opacity:1}
.tool{padding:6px 10px;border-radius:20px;background:var(--bg);font-size:13px;font-weight:700;white-space:nowrap}
.fcard{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:16px;background:#fff}
.fcard.on{border-color:var(--p);background:var(--pl)}
.fcard .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-weight:900}
.fcard.on .chk{background:var(--p);border-color:var(--p)}
.lvup{margin:10px auto 0;display:inline-block;background:#fff3d6;color:#9a6a00;padding:8px 14px;border-radius:12px;font-size:14px}
.dl{display:flex;gap:8px;align-items:flex-start;margin:3px 0;line-height:1.45}
.ab{width:22px;height:22px;border-radius:6px;background:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none;margin-top:1px;color:var(--sub)}
.e2{padding:10px 14px;background:#f7f8fb;border-top:1px solid var(--line);font-size:15px;font-weight:700}
.line{flex:1;min-height:36px;border-bottom:2px solid #cfd5e0;display:flex;flex-wrap:wrap;gap:5px;padding-bottom:5px;align-items:center}
.line.ok{border-color:var(--p)}.line.no{border-color:var(--red)}
.chip{padding:4px 9px;border-radius:9px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px}
.line.ok .chip{border-color:var(--p);color:var(--pd)}.line.no .chip{border-color:var(--red);color:var(--redd)}
#gl{touch-action:none}
.chip{user-select:none;-webkit-user-select:none;cursor:grab;touch-action:none}
.chip.lift{opacity:.3;border-style:dashed;transition:opacity .15s}
.chip.ghost{position:fixed;left:0;top:0;z-index:50;will-change:transform;transition:none;pointer-events:none;opacity:.92;border-color:var(--blue);box-shadow:0 10px 22px rgba(0,0,0,.22);background:#fff}
.blk.back{animation:pop2 .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop2{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.chip.bad{border-color:var(--red);color:var(--redd);background:var(--redl)}
.chip.hinted{border-color:var(--yel);background:#fff7df}
.gmsg{margin:0 10px 6px;padding:7px 10px;border-radius:10px;background:#ffe9a8;color:#6b4e00;font-size:13px;font-weight:700;line-height:1.4;animation:up .2s ease}
.chip.minus,.chip.move,.blk.plus{position:relative}
.chip.move::before{position:absolute;top:-8px;left:-8px;width:18px;height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:900;line-height:18px;text-align:center;content:'↔';background:var(--yel)}
.chip.minus::before,.blk.plus::before{position:absolute;top:-8px;left:-8px;width:18px;height:18px;border-radius:50%;color:#fff;font-size:14px;font-weight:900;line-height:18px;text-align:center}
.chip.minus::before{content:'−';background:var(--red)}
.blk.plus{border-color:var(--p);box-shadow:0 3px 0 var(--p)}
.blk.plus::before{content:'+';background:var(--p)}

/* ===== 귀여움 추가 ===== */
.wave{position:relative;display:inline-block;flex:none}
.wave .paw{position:absolute;right:-7px;top:-4px;width:16px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,.12);transform-origin:50% 100%;animation:wv 1.6s ease-in-out infinite}
@keyframes wv{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(-25deg)}20%,40%{transform:rotate(18deg)}}
.wave .wf{animation:bob 2.4s ease-in-out infinite;display:block}
@keyframes bob{50%{transform:translateY(-3px)}}
.jump{display:inline-block;vertical-align:middle;margin-right:6px;animation:jmp .7s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes jmp{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(2px) scale(1.12,.88)}55%{transform:translateY(-14px) scale(.95,1.06)}100%{transform:translateY(0) scale(1)}}
.pawst{display:block;width:78%;height:78%;margin:auto;transform:rotate(-12deg)}
@media (prefers-reduced-motion:reduce){.wave .paw,.wave .wf,.jump{animation:none}}

.top h1,.greet,.tile .nm,.today h3,.btn,.sheet h4,.hero h2,.pbtn,.big+h2,.lvup,.trophy{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400 !important;letter-spacing:0}
.greet{font-size:21px}.tile .nm{font-size:19px}.today h3{font-size:18px}.btn{font-size:16px}.sheet h4{font-size:18px;display:flex;align-items:center}
.tile .em{display:block;line-height:0}
</style>
</head>
<body>
<div id="app"></div>
<script>

 for(const x of shuffle(same)){if(!seen.has(x[key])){seen.add(x[key]);out.push(x)}if(out.length>=n)break}
 return out;
}

function blockPool(w){
 const mine=new Set(w.toks.map(t=>t.toLowerCase()));
 const src=shuffle(WORDS.filter(x=>x.id!==w.id&&x.lv===w.lv)).flatMap(x=>x.toks.map(t=>t.toLowerCase()));
 const out=[];for(const t of src){if(!mine.has(t)&&!out.includes(t))out.push(t);if(out.length>=Math.max(3,5-w.toks.length))break}
 return shuffle([...w.toks.map(t=>t.toLowerCase()),...out]).map(t=>({t,used:false}));
}

 else{const e=$('#ti');e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');
  c.wrongTry++;if(c.wrongTry>=2)done(false);else{e.select();toast('다시 한번! (기회 1번 더)')}}}

 $('#sh').innerHTML=`<div class="sheet ${ok?'g':'r'}"><h4>${ok?`<span class="jump">${face(me().ch,34)}</span>`:''}${msg}</h4>
 <p><b style="font-size:17px">${c.w.w}</b> <span class="muted">${c.w.pos}</span> · ${c.w.m}<br><span class="muted">🔊 ${c.w.ex}</span></p>
 <div class="row"><button class="btn ghost" style="width:auto;padding:14px 16px" onclick="speak(S.c.w.ex)">🔊</button><button class="btn ${ok?'':'red'}" onclick="S.qi++;vCard()">계속</button></div></div>`;
}
let rec=null;

  rec.onend=()=>{const m=$('#micI');if(m)m.textContent='🎤';rec=null};
  rec.start();

}

 if(D.level<3&&((D.hist.length>=3&&D.hist.reduce((a,b)=>a+b,0)/3>=0.8)||left===0)){D.level++;D.hist=[];up=true}

/* ===== 문법 (대화 문장 조합) ===== 문법 포인트|팁|A한글|B한글|A영어|B영어|함정 블록 */
const GRAW={
1:`부정의문문 대답|부정 질문에도 내용이 맞으면 Yes로 답해요. (예쁘다 → Yes)|그거 안 예뻐?|아니, 예뻐.|Isn't it pretty?|Yes, it is.|no not are
be동사|주어가 I면 am, you/복수면 are를 써요.|회의 준비됐어요?|네, 준비됐어요.|Are you ready for the meeting?|Yes, I am ready.|is are

const GR=[];
[1,2,3].forEach(lv=>GRAW[lv].trim().split('\n').forEach((l,i)=>{const[pt,tip,ak,bk,ae,be,dx]=l.split('|');
 const punct=(be.match(/[.?!]$/)||[''])[0];const toks=be.replace(/[.?!]$/,'').split(' ').map(t=>t.replace(/,$/,''));
 if(toks[0]!=='I')toks[0]=toks[0][0].toLowerCase()+toks[0].slice(1);
 GR.push({id:'g'+lv+'-'+i,lv,pt,tip,ak,bk,ae,be,punct,toks,dx:dx.split(' ')})}));

 if(!D.glevel){D.glevel=1;save()}

function startGram(){
 if(!D.glevel)D.glevel=1;
 const t=today(),gs=D.gram=D.gram||{};
 const rev=Object.entries(gs).filter(([,v])=>v.due<=t).sort((a,b)=>a[1].due<b[1].due?-1:1).slice(0,Math.ceil(goal()*0.3)).map(x=>x[0]);
 const fresh=x=>!gs[x.id];
 const pool=[...shuffle(GR.filter(x=>fresh(x)&&x.lv===D.glevel)),...GR.filter(x=>fresh(x)&&x.lv>D.glevel),...GR.filter(x=>fresh(x)&&x.lv<D.glevel)];
 let ids=[...rev,...pool.slice(0,goal()-rev.length).map(x=>x.id)];
 if(ids.length<goal())ids=[...ids,...shuffle(GR.map(x=>x.id).filter(id=>!ids.includes(id))).slice(0,goal()-ids.length)];
 S={mode:'g',first:{},queue:shuffle(ids),qi:0,doneN:0};S.total=S.queue.length;vGCard();
}
function vGCard(){
 if(S.qi>=S.queue.length)return gFinish();
 const g=G[S.queue[S.qi]],r=(D.gram||{})[g.id];
 S.c={g,fill:[],blocks:shuffle([...g.toks,...g.dx]).map(t=>({t,used:false})),locked:false,wrongTry:0,hints:0,bad:null,dragI:null};
 const tag=r?`<span class="tag rv">${daysAgo(r.last)}일 전</span>`:`<span class="tag">New</span>`;
 app.innerHTML=`<div class="top"><button class="iconbtn" onclick="gQuit()">✕</button><div class="prog"><i style="width:${S.doneN/S.total*100}%"></i></div><span class="trophy">🏆 ${S.doneN}/${S.total}</span></div>

   <div id="gmsg"></div><div class="e2"><div class="dl"><span class="ab">A</span><span>${g.ae}</span></div><div class="dl"><span class="ab">B</span><div class="line" id="gl" onpointerdown="gPD(event)" onpointermove="gPM(event)" onpointerup="gPU(event)" onpointercancel="gPU(event)" onclick="gClick(event)"></div><span>${g.punct}</span></div></div></div>
  <div class="blocks" id="gb"></div>

 </div><div id="sh"></div>`;
 gDraw();speak(g.ae);
}
function chipRects(){const m={};document.querySelectorAll('#gl .chip').forEach(x=>m[x.dataset.k]=x.getBoundingClientRect());return m}
function gDraw(lineOnly){
 const c=S.c,gl=$('#gl'),prev=chipRects();
 gl.className='line'+(c.res===true?' ok':'');
 gl.innerHTML=c.fill.map((f,i)=>`<span class="chip${c.minusB&&c.minusB.has(f.bi)?' bad minus':''}${c.moveB&&c.moveB.has(f.bi)?' bad move':''}${(c.dragging&&c.dragI===i)||f.ph?' lift':''}${f.h?' hinted':''}" data-i="${i}" data-k="${f.bi}">${f.t}</span>`).join('')||'<span class="muted" style="font-weight:500">여기에 문장을 만들어요</span>';
 const bprev={};document.querySelectorAll('#gb .blk').forEach((x,i)=>{if(x.offsetParent)bprev[i]=x.getBoundingClientRect()});
 if(!lineOnly){$('#gb').innerHTML=c.blocks.map((b,i)=>`<button class="blk ${b.used?'used':''}${c.plusB&&c.plusB.has(i)&&!b.used?' plus':''}" onpointerdown="bPD(event,${i})" onclick="gTap(${i})">${b.t}</button>`).join('');
 $('#gmsg').innerHTML=c.msg?`<div class="gmsg">💡 ${c.msg}</div>`:'';
 $('#gok').disabled=c.locked||!c.fill.length;}
 /* 자리 이동 애니메이션 (FLIP) */
 document.querySelectorAll('#gl .chip').forEach(x=>{const p=prev[x.dataset.k],r=x.getBoundingClientRect();try{
  if(p){const dx=p.left-r.left,dy=p.top-r.top;if(Math.abs(dx)+Math.abs(dy)>1)x.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:140,easing:'cubic-bezier(.2,.8,.2,1)'})}
  else if(c.fly&&c.fly.k===x.dataset.k){const f=c.fly.r,dx=f.left-r.left,dy=f.top-r.top;x.animate([{transform:`translate(${dx}px,${dy}px) scale(1.05)`,boxShadow:'0 10px 20px rgba(0,0,0,.18)'},{transform:'none',boxShadow:'none'}],{duration:280,easing:'cubic-bezier(.2,.8,.2,1)'})}
  else x.animate([{transform:'translateY(14px) scale(.7)',opacity:0},{transform:'none',opacity:1}],{duration:200,easing:'cubic-bezier(.2,.8,.2,1)'})}catch(_){}});
 c.fly=null;
 if(!lineOnly)document.querySelectorAll('#gb .blk').forEach((x,i)=>{const p=bprev[i];if(!p||!x.offsetParent||(c.flyBack&&c.flyBack.b===i))return;const r=x.getBoundingClientRect(),dx=p.left-r.left,dy=p.top-r.top;if(Math.abs(dx)+Math.abs(dy)>1)try{x.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:200,easing:'cubic-bezier(.2,.8,.2,1)'})}catch(_){}});
 if(c.flyBack){const b=document.querySelectorAll('#gb .blk')[c.flyBack.b];if(b){const r=b.getBoundingClientRect(),f=c.flyBack.r;try{b.animate([{transform:`translate(${f.left-r.left}px,${f.top-r.top}px) scale(.95)`},{transform:'none'}],{duration:280,easing:'cubic-bezier(.2,.8,.2,1)'})}catch(_){}}c.flyBack=null}
}
function gClr(){const c=S.c;c.bad=c.minus=c.plus=c.move=c.msg=null;c.minusB=c.plusB=c.moveB=null}
/* 틀린 표시는 그 카드를 고칠 때만 하나씩 사라진다 */
function gFix(bi){const c=S.c;[c.minusB,c.plusB,c.moveB].forEach(s=>s&&s.delete(bi));if(c.msg&&!(c.minusB&&c.minusB.size)&&!(c.plusB&&c.plusB.size)&&!(c.moveB&&c.moveB.size))c.msg=null}
function gTap(i){const c=S.c;if(c.noClick||c.locked||!c.blocks[i]||c.blocks[i].used)return;const be=document.querySelectorAll('#gb .blk')[i];if(be)c.fly={k:String(i),r:be.getBoundingClientRect()};c.blocks[i].used=true;c.fill.push({t:c.blocks[i].t,bi:i});gFix(i);gDraw()}
function gUn(i){const c=S.c;if(c.locked||!c.fill[i])return;const bi=c.fill[i].bi;const ce=document.querySelector(`#gl .chip[data-i="${i}"]`);if(ce)c.flyBack={b:bi,r:ce.getBoundingClientRect()};c.blocks[bi].used=false;c.fill.splice(i,1);gFix(bi);gDraw()}

function gPD(e){const c=S.c;const ch=e.target.closest&&e.target.closest('.chip');if(!ch||c.locked)return;
 c.dragI=+ch.dataset.i;c.sx=c.lx=e.clientX;c.sy=c.ly=e.clientY;c.dragging=false;c.moved=false;c.cancelTap=false;c.pid=e.pointerId;
 clearTimeout(c.hold);c.hold=setTimeout(gLift,160)}
function gLift(){const c=S.c;if(c.dragI==null||c.dragging||c.cancelTap)return;
 const el=document.querySelector(`#gl .chip[data-i="${c.dragI}"]`);if(!el)return;const r=el.getBoundingClientRect();
 c.ox=c.sx-r.left;c.oy=c.sy-r.top;c.dragging=true;gFix(c.fill[c.dragI].bi);
 try{$('#gl').setPointerCapture(c.pid)}catch(_){}
 ghost=document.createElement('div');ghost.className='chip ghost';ghost.textContent=c.fill[c.dragI].t;document.body.appendChild(ghost);
 ghost.style.transform=`translate(${c.lx-c.ox}px,${c.ly-c.oy}px) scale(1.12) rotate(-3deg)`;
 gDraw(true)}
function gPM(e){const c=S.c;if(c.dragI==null)return;c.lx=e.clientX;c.ly=e.clientY;
 if(!c.dragging){if(Math.hypot(e.clientX-c.sx,e.clientY-c.sy)>10){c.cancelTap=true;clearTimeout(c.hold)}return}
 if(ghost)ghost.style.transform=`translate(${e.clientX-c.ox}px,${e.clientY-c.oy}px) scale(1.12) rotate(-3deg)`;
 const j=insIdx(e.clientX,e.clientY);
 if(j>=0&&j!==c.dragI){const[m]=c.fill.splice(c.dragI,1);c.fill.splice(j,0,m);c.dragI=j;c.moved=true;gDraw(true)}}
function gClick(e){const c=S.c;if(c.locked||c.justDragged)return;const ch=e.target.closest&&e.target.closest('.chip');if(!ch)return;gUn(+ch.dataset.i)}
function inLine(x,y){const r=$('#gl').getBoundingClientRect();return x>r.left-24&&x<r.right+24&&y>r.top-30&&y<r.bottom+30}
function flyGhost(g,el,cb){if(g&&el){const r=el.getBoundingClientRect();try{const a=g.animate([{transform:g.style.transform},{transform:`translate(${r.left}px,${r.top}px) scale(1) rotate(0)`}],{duration:180,easing:'ease-out',fill:'forwards'});a.onfinish=()=>{g.remove();cb&&cb()};return}catch(_){}}if(g)g.remove();cb&&cb()}
function gPU(e){const c=S.c;if(c.dragI==null)return;clearTimeout(c.hold);const i=c.dragI,was=c.dragging;
 if(!was){c.dragI=null;return}
 c.justDragged=true;setTimeout(()=>c.justDragged=false,120);
 const g=ghost;ghost=null;c.dragI=null;c.dragging=false;
 if(!inLine(e.clientX,e.clientY)){const bi=c.fill[i].bi;c.blocks[bi].used=false;c.fill.splice(i,1);gFix(bi);gDraw();
  return flyHome(g,bi)}
 gDraw();flyGhost(g,document.querySelector(`#gl .chip[data-i="${i}"]`))}
/* 아래 보기 카드를 끌어서 원하는 자리에 넣기 */
let bd=null;
function insIdx(x,y){if(!inLine(x,y))return -1;let n=0;
 document.querySelectorAll('#gl .chip:not(.lift)').forEach(ch=>{const r=ch.getBoundingClientRect(),cy=r.top+r.height/2;
  if(cy<y-r.height/2-4||(Math.abs(cy-y)<=r.height/2+4&&r.left+r.width/2<x))n++});return n}
function bPD(e,i){const c=S.c;if(c.locked||c.blocks[i].used)return;bd={i,sx:e.clientX,sy:e.clientY,drag:false};
 addEventListener('pointermove',bPM,{passive:false});addEventListener('pointerup',bPU);addEventListener('pointercancel',bPU)}
function bPM(e){const c=S.c;if(!bd)return;
 if(!bd.drag){if(Math.hypot(e.clientX-bd.sx,e.clientY-bd.sy)<4)return;bd.drag=true;
  const be=document.querySelectorAll('#gb .blk')[bd.i],r=be.getBoundingClientRect();bd.ox=bd.sx-r.left;bd.oy=bd.sy-r.top;
  ghost=document.createElement('div');ghost.className='chip ghost';ghost.textContent=c.blocks[bd.i].t;document.body.appendChild(ghost);
  c.blocks[bd.i].used=true;gFix(bd.i);gDraw()}
 e.preventDefault();
 ghost.style.transform=`translate(${e.clientX-bd.ox}px,${e.clientY-bd.oy}px) scale(1.12) rotate(-3deg)`;
 const cur=c.fill.findIndex(f=>f.ph),idx=insIdx(e.clientX,e.clientY);
 if(idx<0){if(cur>=0){c.fill.splice(cur,1);gDraw(true)}return}
 if(cur===idx)return;
 const item=cur>=0?c.fill.splice(cur,1)[0]:{t:c.blocks[bd.i].t,bi:bd.i,ph:true};
 c.fill.splice(Math.min(idx,c.fill.length),0,item);gDraw(true)}
function bPU(e){const c=S.c;removeEventListener('pointermove',bPM);removeEventListener('pointerup',bPU);removeEventListener('pointercancel',bPU);
 if(!bd)return;const d=bd;bd=null;if(!d.drag)return;
 c.noClick=true;setTimeout(()=>c.noClick=false,50);
 const g=ghost;ghost=null;const cur=c.fill.findIndex(f=>f.ph);
 if(cur>=0){delete c.fill[cur].ph;gDraw();flyGhost(g,document.querySelector(`#gl .chip[data-i="${cur}"]`))}
 else{c.blocks[d.i].used=false;gDraw();flyHome(g,d.i)}}
function flyHome(g,bi){const b=document.querySelectorAll('#gb .blk')[bi];if(b)b.style.visibility='hidden';flyGhost(g,b,()=>{const x=document.querySelectorAll('#gb .blk')[bi];if(x)x.style.visibility=''})}
function buzz(){try{navigator.vibrate&&navigator.vibrate(5)}catch(e){}const q=$('#gqc');if(q){q.classList.remove('shake');void q.offsetWidth;q.classList.add('shake')}}
function lcsKeep(a,b){const n=a.length,m=b.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
 const keep=new Set();let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){keep.add(i);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return keep}
function gCheck(){const c=S.c;if(c.locked||!c.fill.length)return;
 const ans=c.g.toks.map(norm),got=c.fill.map(f=>norm(f.t));
 if(got.join(' ')===ans.join(' '))return gDone(true);
 c.wrongTry++;gClr();
 const need={};ans.forEach(t=>need[t]=(need[t]||0)+1);
 const left={...need};c.minus=[];got.forEach((t,i)=>{if(left[t]>0)left[t]--;else c.minus.push(i)});
 c.plus=[];Object.entries(left).forEach(([t,n])=>{for(let k=0;k<n;k++){const bi=c.blocks.findIndex((b,j)=>!b.used&&norm(b.t)===t&&!c.plus.includes(j));if(bi>=0)c.plus.push(bi)}});
 const keptIdx=got.map((t,i)=>i).filter(i=>!c.minus.includes(i));
 const keep=lcsKeep(keptIdx.map(i=>got[i]),ans);
 c.move=keptIdx.filter((i,k)=>!keep.has(k));
 c.minusB=new Set(c.minus.map(i=>c.fill[i].bi));c.moveB=new Set(c.move.map(i=>c.fill[i].bi));c.plusB=new Set(c.plus);
 const P=c.plus.length,M=c.minus.length;
 c.msg=P&&M?`빨간 단어는 빼고, 아래 보기에서 ${P}개 단어를 더 사용해 보세요.`:P?`아래 보기에서 ${P}개 단어를 더 사용해서 문장을 완성해 보세요.`:M?`표시된 ${M}개 단어를 빼고 문장을 다시 만들어 보세요.`:'표시된 단어들을 옮겨서 문장을 다시 만들어 보세요.';
 buzz();gDraw();
}
/* 힌트: 다음에 올 단어 하나만 제자리에 넣어줌 */
function gHint(){const c=S.c;if(c.locked)return;
 const ans=c.g.toks.map(norm);let i=0;while(i<c.fill.length&&norm(c.fill[i].t)===ans[i])i++;
 if(i>=ans.length){toast('맞는 단어는 다 있어요. 남는 단어를 빼보세요');return}
 const pre=c.fill.slice(0,i),rest=c.fill.slice(i);let item;
 const k=rest.findIndex(f=>norm(f.t)===ans[i]);
 if(k>=0)item=rest.splice(k,1)[0];else{const bi=c.blocks.findIndex(b=>!b.used&&norm(b.t)===ans[i]);c.blocks[bi].used=true;item={t:c.blocks[bi].t,bi}}
 item.h=true;c.fill=[...pre,item,...rest];c.hints++;gClr();gDraw();toast(`${i+1}번째 단어를 넣어드렸어요`)}
function gDone(ok){
 const c=S.c,g=c.g;c.locked=true;c.res=ok;gDraw();
 if(!(g.id in S.first))S.first[g.id]=!c.wrongTry&&!c.hints;
 S.doneN++;speak(g.be);
 const clean=!c.wrongTry&&!c.hints;
 $('#sh').innerHTML=`<div class="sheet g"><h4><span class="jump">${face(me().ch,34)}</span>${clean?['정답이에요! 🎉','완벽해요! ✨','좋아요! 👏'][Math.random()*3|0]:'맞았어요! 내일 한 번 더 복습해요 👍'}</h4>
 <p><b>B: ${g.be}</b><br><span class="tag" style="margin:6px 0 4px">📌 ${g.pt}</span><br><span class="muted">${g.tip}</span></p>
 <div class="row"><button class="btn ghost" style="width:auto;padding:13px 16px" onclick="speak(S.c.g.be)">🔊</button><button class="btn" onclick="S.qi++;vGCard()">계속</button></div></div>`;
}
function gVoice(){
 const c=S.c;if(c.locked)return;
 if(!SR){toast('이 기기에선 음성 모드를 쓸 수 없어요');return}
 if(rec){try{rec.stop()}catch(e){}return}
 try{rec=new SR();rec.lang='en-US';rec.maxAlternatives=5;
  rec.onstart=()=>{$('#micI').textContent='🔴';toast('B 문장을 말해보세요...')};
  rec.onresult=e=>{const alts=[...e.results[0]].map(r=>r.transcript);
   if(alts.some(a=>norm(a)===norm(c.g.toks.join(' '))))gDone(true);else toast(`"${alts[0]}" — 다시 말해볼까요?`)};
  rec.onerror=e=>toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'이 화면에선 마이크를 쓸 수 없어요':'잘 안 들렸어요');
  rec.onend=()=>{const m=$('#micI');if(m)m.textContent='🎤';rec=null};rec.start();
 }catch(e){toast('이 기기에선 음성 모드를 쓸 수 없어요');rec=null}
}
function gSave(){
 const t=today(),gs=D.gram=D.gram||{};
 Object.entries(S.first).forEach(([id,ok])=>{const r=gs[id]||{box:0,wrong:0};
  if(ok){r.box=Math.min(r.box+1,4);r.due=addDays(t,INTV[r.box])}else{r.box=0;r.wrong++;r.due=addDays(t,1)}r.last=t;gs[id]=r});
 S.first={};save();
}
function gQuit(){
 app.insertAdjacentHTML('beforeend',`<div id="qa" style="position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:9"><div class="card" style="width:100%;border-radius:22px 22px 0 0;padding:20px;display:flex;flex-direction:column;gap:10px">
 <h3 style="font-weight:900">학습을 그만할까요?</h3><p class="muted">푼 문제는 저장돼요.</p>
 <button class="btn" onclick="$('#qa').remove()">계속하기</button><button class="btn ghost" onclick="gSave();vGram()">그만하기</button></div></div>`);
}
function gFinish(){
 const res={...S.first};gSave();
 const t=today(),wasDone=!!D.days[t];D.days[t]=true;
 const ids=Object.keys(res),okN=ids.filter(id=>res[id]).length;
 let up=false;D.ghist=[...(D.ghist||[]),okN/Math.max(1,ids.length)].slice(-3);
 const left=GR.filter(x=>x.lv===D.glevel&&!D.gram[x.id]).length;
 if(D.glevel<3&&((D.ghist.length>=3&&D.ghist.reduce((a,b)=>a+b,0)/3>=0.8)||left===0)){D.glevel++;D.ghist=[];up=true}
 save();
 app.innerHTML=`<div class="body">
 <div style="text-align:center;padding-top:16px"><div class="big stampPop">${wasDone?'💪':`<span style="display:inline-block;width:70px;height:70px">${PAW}</span>`}</div>
 <h2 style="font-size:20px;font-weight:900;margin-top:6px">${wasDone?'문법 완료!':'오늘 출석 도장 쾅!'}</h2>
 ${up?`<div class="lvup">⬆️ 레벨업! 이제 <b>${LV_NAME[D.glevel]}</b> 문법이 나와요</div>`:''}<p class="muted" style="font-size:14px;margin-top:4px">한 번에 맞춘 문제 ${okN}/${ids.length} · 🔥 ${streak()}일 연속</p></div>
 <div class="card rlist">${ids.map(id=>{const g=G[id];return `<div class="it"><span>${res[id]?'✅':'🔁'}</span><div style="flex:1"><b style="font-size:14px">${g.be}</b><div class="muted">📌 ${g.pt}</div></div><button class="iconbtn" style="font-size:18px" onclick="speak(G['${id}'].be)">🔊</button></div>`}).join('')}</div>
 <button class="btn" onclick="vGram()">완료</button></div>`;
}

/* ===== 내 단어장 ===== */
let bookTab='all';
function vBook(){
 const t=today();
 const all=Object.entries(D.words).map(([id,v])=>({...W[id],...v,id})).sort((a,b)=>a.seen<b.seen?1:-1);
 const list=all.filter(x=>bookTab==='all'||(bookTab==='hard'&&(x.wrong>0||x.box===0))||(bookTab==='done'&&x.box>=3));
 const st=x=>x.box>=3?'<span class="tag">외움</span>':x.due<=t?'<span class="tag rv">복습</span>':'<span class="tag" style="background:var(--bg);color:var(--sub)">학습 중</span>';
 app.innerHTML=`<div class="top"><button class="iconbtn" onclick="vVocab()">‹</button><h1>내 단어장</h1><span class="muted">${all.length}개</span></div>
 <div class="body"><div class="tabs">${[['all','전체'],['hard','헷갈리는'],['done','외운']].map(([k,n])=>`<button class="${bookTab===k?'on':''}" onclick="bookTab='${k}';vBook()">${n}</button>`).join('')}</div>
 ${list.length?`<div class="rlist">${list.map(x=>`<div class="it"><div style="flex:1"><b style="font-size:16px">${x.w}</b><div class="muted">${x.m}</div></div>${st(x)}<button class="iconbtn" style="font-size:18px" onclick="speak('${x.w.replace(/'/g,"\\'")}')">🔊</button></div>`).join('')}</div>`:'<div class="empty">아직 단어가 없어요</div>'}
 </div>`;
}

/* 시작 */
(()=>{let u=null;try{u=new URLSearchParams(location.search).get('u')}catch(e){}
 const p=PEOPLE.find(x=>x.name===u);if(p)return setP(p.id);
 cur&&PEOPLE.some(p=>p.id===cur)?vHome():vProfile()})();
</script>
