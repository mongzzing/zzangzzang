<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짱짱이네</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* 업무 앱처럼 차분한 화면: 왼쪽 사람 레일, 왼쪽 판에 맡기는 칸, 오른쪽 판에 진행 접수증 */
:root {
  --bg: #f0f0f3;
  --panel: #fafafa;
  --card: #ffffff;
  --line: #e0e0e3;
  --text: #242424;
  --soft: #616161;
  --brand: #5b5fc7;
  --brand-dark: #4f52b2;
  --brand-tint: #e8ebfa;
  --alert: #c4314b;
  --alert-tint: #fcf0f2;
  --good: #107c41;
  --good-tint: #e7f4ec;
  --font: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; word-break: keep-all; font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
h1, h2, h3, p { margin: 0; }

.avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; display: block; flex: none; }
.logo { display: inline-flex; align-items: center; gap: 3px; color: var(--brand); font-family: "Jua", var(--font); font-size: 20px; font-weight: 400; line-height: 1; white-space: nowrap; flex: none; }
.logo img { width: 30px; height: 31px; display: block; }
.logo.home { background: transparent; border: 0; padding: 0; cursor: pointer; }

/* 첫 화면 */
.picker { height: 100%; display: grid; place-items: center; padding: 16px; overflow: auto; }
.picker-card { display: flex; flex-direction: column; align-items: center; gap: 28px; width: 100%; max-width: 520px; text-align: center; }
.picker-card .logo { flex-direction: column; gap: 2px; font-size: 40px; }
.picker-card .logo img { width: 104px; height: 106px; }
.accounts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; width: 100%; }
.account { background: transparent; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
.app-icon { position: relative; display: block; width: 100%; max-width: 132px; aspect-ratio: 1; transition: transform .14s ease-out; }
.app-icon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 24%; box-shadow: 0 2px 8px rgba(0,0,0,.18); display: block; }
.account:hover .app-icon { transform: translateY(-4px); }
.account:active .app-icon { transform: scale(.94); }
.badge { position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--alert); color: #fff; font-size: 13px; font-weight: 600; display: grid; place-items: center; border: 2px solid var(--bg); }
.pin-form { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 280px; text-align: left; font-weight: 600; }
.btn:disabled { opacity: .7; cursor: default; }
@media (max-width: 460px) { .accounts { gap: 16px; } }
@media (prefers-reduced-motion: reduce) { .app-icon { transition: none; } }

/* 앱 */
.app { height: 100%; display: grid; grid-template-rows: 48px minmax(0, 1fr); }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.me { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; border-radius: 6px; padding: 4px 6px; }
.me:hover { background: #e5e5e8; }
.shell { display: grid; grid-template-columns: 68px minmax(0, 1fr); min-height: 0; }
.rail { display: flex; flex-direction: column; gap: 2px; padding: 4px; }
.rail-btn { position: relative; background: transparent; border: 0; border-radius: 6px; padding: 7px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--soft); }
.rail-btn:hover { background: #e5e5e8; color: var(--text); }
.rail-btn[aria-pressed="true"] { color: var(--brand); font-weight: 600; }
.rail-btn[aria-pressed="true"]::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; background: var(--brand); border-radius: 2px; }
.stage { background: var(--panel); border-radius: 8px 0 0 0; overflow: auto; min-height: 0; }
.columns { max-width: 1080px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.05); padding: 16px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.section-title { font-size: 16px; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .field-label { font-weight: 600; }
.field input, .field textarea { background: #fafafa; border: 1px solid var(--line); border-bottom: 1px solid #8a8a8a; border-radius: 4px; padding: 7px 10px; width: 100%; }
.field input:focus, .field textarea:focus { border-bottom: 2px solid var(--brand); outline: none; }
.field textarea { min-height: 112px; resize: vertical; }
.field textarea.short { min-height: 64px; }
::placeholder { color: #8a8a8a; }
.drop { border: 1px dashed #b0b0b0; border-radius: 6px; padding: 24px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-weight: 600; color: var(--brand-dark); }
.drop:hover, .drop.over { background: var(--brand-tint); border-color: var(--brand); }
.drop small { color: var(--soft); font-weight: 400; font-size: 12px; }
.drop:focus-within { outline: 2px solid var(--brand); outline-offset: 1px; }
.field input.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 4px; }
.thumbs:empty { display: none; }
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; display: block; }
.error { color: var(--alert); font-size: 13px; font-weight: 600; }
.error:empty { display: none; }
.btn { background: var(--brand); color: #fff; border: 0; border-radius: 4px; padding: 7px 16px; font-weight: 600; text-decoration: none; display: inline-block; }
.btn:hover { background: var(--brand-dark); }
.form .btn { align-self: flex-start; min-width: 120px; }

.tickets { display: flex; flex-direction: column; gap: 10px; }
.ticket { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
.ticket.ask { border-color: #e9b4bf; }
.ticket-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.ticket h3 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.meta { font-size: 13px; color: var(--soft); }
.chip { font-size: 12px; font-weight: 600; border-radius: 4px; padding: 2px 8px; white-space: nowrap; background: #f0f0f0; color: var(--soft); }
.chip.ready { background: var(--good-tint); color: var(--good); }
.chip.need { background: var(--alert-tint); color: var(--alert); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.steps li { border-top: 3px solid var(--line); padding-top: 4px; font-size: 12px; color: var(--soft); }
.steps li.on { border-color: var(--brand); color: var(--text); font-weight: 600; }
.ticket.finished .steps li.on { border-color: var(--good); }
.question { font-weight: 600; }
.answer { display: flex; gap: 6px; }
.answer input { flex: 1; min-width: 0; background: #fafafa; border: 1px solid var(--line); border-bottom: 1px solid #8a8a8a; border-radius: 4px; padding: 6px 10px; }
.answer input:focus { border-bottom: 2px solid var(--brand); outline: none; }
.ticket .btn { align-self: flex-start; }

.tabs { display: flex; gap: 4px; padding: 8px 20px 0; max-width: 1080px; margin: 0 auto; border-bottom: 1px solid var(--line); }
.tab { background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; font-weight: 600; color: var(--soft); }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--brand); border-bottom-color: var(--brand); }
.pane { max-width: 720px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.chat-log { display: flex; flex-direction: column; gap: 8px; min-height: 240px; max-height: 58vh; overflow: auto; }
.bubble { max-width: 85%; padding: 8px 12px; border-radius: 8px; background: #f0f0f4; white-space: pre-wrap; word-break: break-word; align-self: flex-start; }
.bubble.me { background: var(--brand-tint); align-self: flex-end; }
.chat-form textarea { flex: 1; min-width: 0; min-height: 40px; max-height: 120px; resize: vertical; background: #fafafa; border: 1px solid var(--line); border-bottom: 1px solid #8a8a8a; border-radius: 4px; padding: 7px 10px; }
.chat-form textarea:focus { border-bottom: 2px solid var(--brand); outline: none; }
.chat-form .btn { align-self: flex-end; }
#guide { min-height: 260px; }
.saved { font-size: 13px; color: var(--good); font-weight: 600; }

/* 홈 */
.back { background: transparent; border: 0; border-radius: 6px; padding: 4px 8px 4px 2px; display: flex; align-items: center; gap: 2px; font-weight: 600; color: var(--brand-dark); }
.back:hover { background: #e5e5e8; }
.rail-btn .ico { font-size: 20px; line-height: 1; }
.home-view { max-width: 760px; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; }
.hello { font-size: 22px; font-weight: 700; }
.hello small { display: block; font-size: 14px; font-weight: 400; color: var(--soft); margin-top: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.tile { text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 18px 16px; min-height: 140px; transition: transform .12s ease-out, box-shadow .12s; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.08); }
.tile .t-ico { font-size: 32px; line-height: 1; }
.tile .t-name { font-size: 16px; font-weight: 700; margin-top: 4px; }
.tile .t-desc { color: var(--soft); font-size: 13px; }
.tile .t-status { margin-top: auto; font-size: 12px; font-weight: 600; }
.tile .t-status.done { color: var(--good); }
.tile .t-status.todo { color: var(--alert); }
.tile.soon { border-style: dashed; background: transparent; box-shadow: none; color: var(--soft); align-items: center; justify-content: center; text-align: center; }
.tile.soon:hover { transform: none; box-shadow: none; }

/* 영어 */
.eng { max-width: 720px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.eng-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.eng-head h2 { font-size: 20px; font-weight: 700; }
.eng-head .meta { margin-top: 2px; }
.fields { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 13px; color: var(--soft); }
.fchip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.tbtn { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.tbtn[aria-pressed="true"] { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-dark); }
.exprs { display: flex; flex-direction: column; gap: 12px; }
.expr { display: flex; flex-direction: column; gap: 10px; }
.expr-top { display: flex; align-items: flex-start; gap: 10px; }
.num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--brand-tint); color: var(--brand-dark); font-weight: 700; display: grid; place-items: center; font-size: 13px; margin-top: 2px; }
.expr-main { flex: 1; min-width: 0; }
.expr-en { font-size: 19px; font-weight: 700; line-height: 1.3; }
.expr-ko { color: var(--soft); font-size: 14px; margin-top: 2px; }
.say { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 17px; }
.say.small { width: 34px; height: 34px; font-size: 15px; background: var(--brand-tint); color: var(--brand-dark); }
.say.playing { background: var(--good); color: #fff; }
.examples { list-style: none; margin: 0; padding: 0 0 0 36px; display: flex; flex-direction: column; gap: 8px; }
.ex { display: flex; gap: 10px; align-items: center; background: #f7f7fa; border-radius: 8px; padding: 10px 10px 10px 12px; }
.ex-text { flex: 1; min-width: 0; }
.ex-en { font-size: 15px; }
.ex-en b { color: var(--brand-dark); }
.ex-ko { font-size: 12px; color: var(--soft); margin-top: 1px; }
.hide-en .expr-en:not(.peek), .hide-en .ex-en:not(.peek) { filter: blur(7px); cursor: pointer; user-select: none; }
.hide-en .expr-en, .hide-en .ex-en { transition: filter .15s; }
.levels { display: flex; gap: 6px; }
/* 영작 체크 */
.quiz { display: flex; flex-direction: column; gap: 12px; border-color: var(--brand); }
.quiz-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.quiz-tag { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 2px 8px; background: var(--brand-tint); color: var(--brand-dark); }
.quiz-tag.review { background: #fff4d6; color: #8a5a00; }
.quiz-ko { font-size: 18px; font-weight: 700; line-height: 1.4; }
.quiz-hint { font-size: 13px; color: var(--soft); }
.quiz textarea { width: 100%; min-height: 84px; resize: vertical; background: #fafafa; border: 1px solid var(--line); border-bottom: 1px solid #8a8a8a; border-radius: 6px; padding: 10px; font-size: 16px; }
.quiz textarea:focus { border-bottom: 2px solid var(--brand); outline: none; }
.quiz-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.ghost { background: var(--card); color: var(--brand-dark); border: 1px solid var(--line); }
.result { border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.result.pass { background: var(--good-tint); }
.result.fail { background: var(--alert-tint); }
.score { font-size: 22px; font-weight: 800; }
.result.pass .score { color: var(--good); }
.result.fail .score { color: var(--alert); }
.answer-line { display: flex; gap: 8px; align-items: center; }
.answer-line p { flex: 1; font-size: 15px; }
.miss { color: var(--alert); font-weight: 800; text-decoration: underline; }
.summary { text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.summary .big { font-size: 40px; }
/* 가족 달력 */
.fam-today { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.fam-person { display: flex; align-items: center; gap: 6px; font-size: 13px; background: #f5f5f7; border-radius: 999px; padding: 4px 10px 4px 4px; }
.fam-person img { width: 26px; height: 26px; border-radius: 50%; display: block; }
.fam-person.not img { filter: grayscale(1); opacity: .45; }
.fam-person b { font-weight: 700; }
.fam-day { position: relative; aspect-ratio: 1; border-radius: 6px; background: #f5f5f7; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 2px; font-size: 11px; color: var(--soft); }
.fam-day.today { outline: 2px solid var(--brand); outline-offset: -2px; color: var(--text); font-weight: 700; }
.fam-day.future { opacity: .45; }
.fam-faces { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; margin-top: 1px; }
.fam-faces img { width: clamp(10px, 3.2vw, 16px); height: clamp(10px, 3.2vw, 16px); border-radius: 50%; display: block; }
.source { font-size: 12px; color: var(--soft); }
.done-btn { width: 100%; padding: 14px; font-size: 16px; border-radius: 8px; font-weight: 700; }
.done-btn.is-done { background: var(--good); }
.undo { align-self: center; background: transparent; border: 0; color: var(--soft); font-size: 12px; text-decoration: underline; }
.notice { background: var(--alert-tint); color: var(--alert); border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 600; }
.board-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.board-head .meta b { color: #d23c3c; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: 11px; color: var(--soft); font-weight: 600; padding-bottom: 2px; }
.day { position: relative; aspect-ratio: 1; border-radius: 6px; background: #f5f5f7; display: grid; place-items: center; font-size: 12px; color: var(--soft); }
.day.future { opacity: .45; }
.day.today { outline: 2px solid var(--brand); outline-offset: -2px; color: var(--text); font-weight: 700; }
.day.done { background: transparent; }
.stamp { position: absolute; inset: 8%; border: 2.5px solid #d23c3c; border-radius: 50%; color: #d23c3c; display: grid; place-items: center; font-family: "Jua", var(--font); font-size: clamp(9px, 2.4vw, 13px); line-height: 1.05; text-align: center; transform: rotate(-14deg); opacity: .88; }
.complete { margin-top: 12px; text-align: center; padding: 14px; border: 3px double #d23c3c; border-radius: 10px; color: #d23c3c; font-family: "Jua", var(--font); font-size: 20px; }

@media (max-width: 800px) {
  .eng, .home-view { padding: 14px 12px; }
  .examples { padding-left: 0; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .stage { border-radius: 0; }
  .columns { grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 14px; }
  .tabs { padding: 4px 12px 0; }
  .pane { padding: 12px; }
}
</style>

      .then(r => r.json())
      .then(d => d.ok ? resolve(d.result) : reject(new Error(d.error)))
      .catch(reject);
  } else if (window.google && google.script) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  } else {
    mock[fn](...args).then(resolve, reject);
  }
});

function whenText(iso) {

  if (min < 1) return '방금';
  if (min < 60) return min + '분 전';
  if (min < 1440) return Math.floor(min / 60) + '시간 전';
  return Math.floor(min / 1440) + '일 전';
}

  const chipCls = t.question || t.error ? 'need' : finished ? 'ready' : '';

  const steps = el('ol', 'steps');

  box.append(head, steps);

    const f = el('form', 'answer');
    const input = el('input');
    input.id = 'answer-' + t.id;
    input.type = 'text';
    input.placeholder = '건물 뒤에 있어요';
    input.setAttribute('aria-label', t.question);
    const go = el('button', 'btn', '답하기');
    go.type = 'submit';
    f.append(input, go);
    f.addEventListener('submit', async e => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      go.disabled = true;
      try {
        await call('answerQuestion', pin, current, t.id, t.question, text);
        t.question = '';
        render();
      } catch (err) {
        go.disabled = false;

    if (t.title) box.append(el('p', 'meta', t.title));

// 큰 사진은 줄여서 올린다. 위치 정보도 이때 빠진다
async function prepare(file) {
  if (!file.type.startsWith('image/')) return { blob: file, name: file.name, mime: file.type || 'application/octet-stream' };
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const scale = Math.min(1, MAX_LONG_SIDE / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * scale);
    canvas.height = Math.round(bmp.height * scale);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    bmp.close();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
    return { blob, name: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg' };
  } catch (e) {
    return { blob: file, name: file.name, mime: file.type || 'application/octet-stream' };
  }
}

const toBase64 = blob => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(String(r.result).split(',')[1]);
  r.onerror = () => reject(r.error);
  r.readAsDataURL(blob);
});

async function uploadOne(id, file, index) {
  const p = await prepare(file);
  const data = await toBase64(p.blob);
  const name = String(index + 1).padStart(3, '0') + '_' + p.name;
  for (let tryNo = 0; ; tryNo++) {
    try {
      return await call('uploadPhoto', pin, current, id, name, p.mime, data);
    } catch (e) {
      if (tryNo >= 2) throw e;
    }
  }
}

async function submit(e) {
  e.preventDefault();
  if (busy) return;
  const place = $('place').value.trim();
  if (!picked.length) { $('error').textContent = '사진을 먼저 넣어 주세요.'; return; }
  if (!place) { $('error').textContent = '다녀온 곳 이름을 적어 주세요.'; $('place').focus(); return; }

  busy = true;
  const send = $('send');
  send.disabled = true;
  $('error').textContent = '';
  try {
    // 실패 후 다시 누르면 올린 사진은 건너뛴다
    if (!pending || pending.person !== current) {
      send.textContent = '봉투 준비하는 중';
      pending = { person: current, id: await call('createItem', pin, current, place, $('memo').value, $('request').value), done: 0 };
    }
    for (let i = pending.done; i < picked.length; i++) {
      send.textContent = '사진 ' + (i + 1) + '/' + picked.length + ' 올리는 중';
      await uploadOne(pending.id, picked[i], i);
      pending.done = i + 1;
    }
    await call('finishItem', pin, current, pending.id, picked.length);
    const count = picked.length;
    const id = pending.id;
    picked = [];
    pending = null;
    e.target.reset();
    $('thumbs').replaceChildren();
    if (state) state[current].unshift({ id, place, photos: count, createdAt: new Date().toISOString(), step: 0, question: '' });
    render();
    refresh();
  } catch (err) {
    $('error').textContent = '올리다 끊겼어요. 맡기기를 다시 누르면 이어서 올려요.';
  } finally {
    busy = false;
    send.disabled = false;
    send.textContent = '맡기기';
  }
}

function dayIndex(d, len, base) {
  const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - (base || ENG_BASE)) / 864e5);
  return ((diff % len) + len) % len;
}

async function loadEng() {
  const who = current;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(engCacheKey(who)) || 'null'); } catch (e) { /* 없어도 됨 */ }
  engData = Object.assign(engDefault(), cached || {});
  if (view === 'eng') renderEng(); else if (view === 'home') renderHome();
  try {
    const server = await call('getEng', pin, who);
    if (who !== current) return;
    if (server) {
      const mergedDone = Object.assign({}, server.done || {}, engData.done);
      engData = Object.assign(engDefault(), server, { done: mergedDone });
    }
    try { localStorage.setItem(engCacheKey(who), JSON.stringify(engData)); } catch (e) { /* 없어도 됨 */ }
    if (view === 'eng') renderEng(); else if (view === 'home') renderHome();
  } catch (e) { /* 폰 사본으로 계속 */ }
}

async function saveEng() {
  const who = current, data = engData;
  try { localStorage.setItem(engCacheKey(who), JSON.stringify(data)); } catch (e) { /* 없어도 됨 */ }
  $('eng-error').textContent = '';
  try {
    await call('saveEng', pin, who, data);
  } catch (e) {
    $('eng-error').textContent = '기록을 드라이브에 못 남겼어요. 폰에는 저장돼 있어요.';
  }
}

// 읽어주기 (폰·PC 브라우저에 있는 영어 음성)
const TTS = 'speechSynthesis' in window;
let voice = null, playingBtn = null;
function pickVoice() {
  if (!TTS) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
  const pref = ['Samantha', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Ava', 'Allison', 'Alex'];
  voice = pref.map(p => vs.find(v => v.name.includes(p))).find(Boolean) || vs[0] || null;
}
if (TTS) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) { /* 없어도 됨 */ } }
function setPlaying(btn) {
  if (playingBtn) playingBtn.classList.remove('playing');
  playingBtn = btn;
  if (btn) btn.classList.add('playing');
}
function stopSpeak() { if (TTS) { try { speechSynthesis.cancel(); } catch (e) { /* 없어도 됨 */ } } setPlaying(null); }
function utter(text, btn) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if (voice) u.voice = voice;
  u.rate = engData && engData.slow ? 0.72 : 0.95;
  u.onstart = () => setPlaying(btn);
  u.onend = () => { if (playingBtn === btn) setPlaying(null); };
  u.onerror = () => setPlaying(null);
  return u;
}
function speakList(list) {
  if (!TTS) { $('tts-notice').hidden = false; return; }
  try { speechSynthesis.cancel(); list.forEach(([t, b]) => speechSynthesis.speak(utter(t, b))); } catch (e) { $('tts-notice').hidden = false; }
}
function sayBtn(text, small) {
  const b = el('button', 'say' + (small ? ' small' : ''), '🔊');
  b.type = 'button';
  b.setAttribute('aria-label', '듣기: ' + text);
  b.addEventListener('click', () => speakList([[text, b]]));
  return b;
}

function highlight(sentence, expr) {
  const core = expr.split('/')[0].replace(/~|\bA\b|\bB\b|\?/g, '').trim().split(/\s+/).filter(Boolean);
  const p = el('p', 'ex-en');
  const lower = sentence.toLowerCase();
  let idx = -1, len = 0;
  for (let n = core.length; n > 0 && idx < 0; n--) {
    const piece = core.slice(0, n).join(' ').toLowerCase();
    const i = lower.indexOf(piece);
    if (i >= 0 && piece.length > 2) { idx = i; len = piece.length; }
  }
  if (idx < 0) { p.textContent = sentence; return p; }
  p.append(sentence.slice(0, idx), el('b', '', sentence.slice(idx, idx + len)), sentence.slice(idx + len));
  return p;
}

function renderEng() {
  if (!engData) engData = engDefault();
  const s = engData;
  if (!FIELDS[s.field]) s.field = 'fin';
  const now = new Date();
  const field = FIELDS[s.field];
  if (!LEVELS[s.level]) s.level = 'basic';
  const base = field.start ? new Date(field.start[0], field.start[1], field.start[2]) : ENG_BASE;
  const idx = dayIndex(now, field.days.length, base);
  const dk = keyOf(now), ck = s.field + '-' + s.level + '-' + dk;
  Object.keys(LEVELS).forEach(lv => loadDay(s.field, lv, dk));
  const fromFile = dayCache[ck];
  const waiting = !fromFile && dayLoading[ck];
  const items = fromFile || (waiting && s.level === 'adv' ? [] : field.days[idx]);
  $('eng-source').textContent = fromFile ? '' : dayLoading[ck] ? '오늘 표현 불러오는 중이에요.'
    : s.level === 'adv' ? '오늘 심화 표현이 아직 준비 안 돼서 기본 표현을 보여 드려요. 내일부터는 매일 새로 나와요.' : '';
  const W = ['일', '월', '화', '수', '목', '금', '토'];
  $('eng-date').textContent = (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + W[now.getDay()] + '요일 · ' + field.name + ' · ' + LEVELS[s.level];
  $('tts-notice').hidden = TTS;

  $('fields').replaceChildren(...Object.entries(FIELDS).map(([k, f]) => {
    const b = el('button', 'fchip', f.name);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(k === s.field));
    b.addEventListener('click', () => { s.field = k; stopSpeak(); renderEng(); saveEng(); });
    return b;
  }));
  $('slow').setAttribute('aria-pressed', String(!!s.slow));
  $('levels').replaceChildren(...Object.entries(LEVELS).map(([k, name]) => {
    const b = el('button', 'fchip', name);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(k === s.level));
    b.addEventListener('click', () => { s.level = k; stopSpeak(); renderEng(); saveEng(); });
    return b;
  }));
  $('hide-en').setAttribute('aria-pressed', String(!!s.hideEn));
  $('exprs').classList.toggle('hide-en', !!s.hideEn);

  const queue = [];
  $('exprs').replaceChildren(...items.map((it, i) => {
    const card = el('article', 'card expr');
    const top = el('div', 'expr-top');
    const main = el('div', 'expr-main');
    main.append(el('p', 'expr-en', it.en), el('p', 'expr-ko', it.ko));
    const spoken = it.en.replace(/~/g, '').trim();
    const sb = sayBtn(spoken, false);
    top.append(el('span', 'num', i + 1), main, sb);
    queue.push([spoken, sb]);
    const ul = el('ul', 'examples');
    it.ex.forEach(([en, ko]) => {
      const li = el('li', 'ex');
      const t = el('div', 'ex-text');
      t.append(highlight(en, it.en), el('p', 'ex-ko', ko));
      const b = sayBtn(en, true);
      queue.push([en, b]);
      li.append(t, b);
      ul.append(li);
    });
    card.append(top, ul);
    return card;
  }));
  $('play-all').onclick = () => speakList(queue);

  const done = !!s.done[keyOf(now)];
  todayQuiz = { items: fromFile || (items.length ? items : null), field: s.field, level: s.level };
  const reviews = dueReviews().length;
  const db = $('done-btn');
  db.textContent = done ? '✓ 오늘 공부 완료! 다시 풀어 보기' : '✍️ 영작 체크하고 도장 받기' + (reviews ? ' (복습 ' + reviews + '개 포함)' : '');
  db.classList.toggle('is-done', done);
  db.hidden = !!quiz;
  $('undo').hidden = true;
  renderBoard(s, now);
  renderFamily(now);
}

function renderBoard(s, now) {
  const y = now.getFullYear(), m = now.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const first = new Date(y, m, 1).getDay();
  let count = 0;
  for (let d = 1; d <= days; d++) if (s.done[keyOf(new Date(y, m, d))]) count++;
  let streak = 0;
  const c = new Date(y, m, now.getDate());
  if (!s.done[keyOf(c)]) c.setDate(c.getDate() - 1);
  while (s.done[keyOf(c)]) { streak++; c.setDate(c.getDate() - 1); }

  $('board-title').textContent = (m + 1) + '월 도장판';
  $('board-meta').replaceChildren(el('b', '', count + '일'), ' / ' + days + '일' + (streak > 1 ? ' · 🔥 ' + streak + '일 연속' : ''));
  const cells = ['일', '월', '화', '수', '목', '금', '토'].map(w => el('div', 'dow', w));
  for (let i = 0; i < first; i++) cells.push(el('div'));
  for (let d = 1; d <= days; d++) {
    const isDone = !!s.done[keyOf(new Date(y, m, d))];
    const cls = ['day'];
    if (isDone) cls.push('done');
    if (d === now.getDate()) cls.push('today');
    if (d > now.getDate()) cls.push('future');
    const cell = el('div', cls.join(' '), isDone ? '' : d);
    if (isDone) {
      const st = el('span', 'stamp');
      st.append(String(d), el('br'), '참잘');
      cell.append(st);
      cell.setAttribute('aria-label', d + '일 완료');
    }
    cells.push(cell);
  }
  $('cal').replaceChildren(...cells);
  $('complete').replaceChildren(...(count === days ? [el('div', 'complete', '🏅 ' + (m + 1) + '월 완주! 참 잘했어요')] : []));
}

// 배운 표현은 engData.learned 에 쌓인다. 맞히면 1→3→7→14일 뒤에 다시 나오고, 틀리면 다음 날 다시 나온다
const REVIEW_DAYS = [1, 1, 3, 7, 14];   // box 0~4 → 다음 복습까지 날짜 수. box 5 는 졸업
const REVIEW_MAX = 6;
let quiz = null, todayQuiz = null;

const addDays = (key, n) => { const [y, m, d] = key.split('-').map(Number); return keyOf(new Date(y, m - 1, d + n)); };
const exprKey = (field, en) => field + '|' + en.toLowerCase().replace(/\s+/g, ' ').trim();

function dueReviews() {
  const today = keyOf(new Date());
  const todayKeys = new Set(((todayQuiz && todayQuiz.items) || []).map(it => exprKey(todayQuiz.field, it.en)));
  return Object.entries((engData && engData.learned) || {})
    .filter(([k, x]) => x.due && x.due <= today && !todayKeys.has(k))
    .sort((a, b) => (a[1].due < b[1].due ? -1 : 1))
    .slice(0, REVIEW_MAX);
}

function startQuiz() {
  stopSpeak();
  const qs = [];
  const t = todayQuiz;
  if (t && t.items) t.items.forEach(it => qs.push({ key: exprKey(t.field, it.en), en: it.en, ko: it.ko, ex: it.ex, sen: it.ex[0], isNew: true, field: t.field, level: t.level }));
  dueReviews().forEach(([k, x]) => qs.push({ key: k, en: x.en, ko: x.ko, ex: x.ex, sen: x.ex[(x.box || 0) % 2] || x.ex[0], isNew: false, field: x.field, level: x.level }));
  if (!qs.length) return;
  quiz = { qs, i: 0, graded: false, right: 0 };
  $('done-btn').hidden = true;
  renderQuiz();
  $('quiz').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// 채점: 단어 단위로 맞춰 보고(순서 포함) 비슷한 정도를 % 로
const CONTRACT = [[/n't\b/g, ' not'], [/'ll\b/g, ' will'], [/'re\b/g, ' are'], [/'ve\b/g, ' have'], [/'m\b/g, ' am'], [/'d\b/g, ' would']];
function words(s) {
  let t = String(s).toLowerCase().replace(/[’‘]/g, "'");
  t = t.replace(/\bwon't\b/g, 'will not').replace(/\bcan't\b/g, 'can not').replace(/\bcannot\b/g, 'can not');
  CONTRACT.forEach(([r, w]) => { t = t.replace(r, w); });
  return t.replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
}
function grade(answer, user) {
  const a = words(answer), u = words(user);
  const n = a.length, m = u.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = a[i] === u[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const hit = new Set();
  for (let i = 0, j = 0; i < n && j < m;) {
    if (a[i] === u[j]) { hit.add(i); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  const score = n + m ? Math.round(200 * L[0][0] / (n + m)) : 0;
  return { score, hit, a };
}
// 정답 문장을 원래 모양대로 보여 주되, 못 쓴 단어는 빨갛게
function markAnswer(answer, hit) {
  const p = el('p');
  let idx = 0;
  answer.split(/(\s+)/).forEach(tok => {
    if (!tok.trim()) { p.append(tok); return; }
    const n = words(tok).length;
    let missed = false;
    for (let k = 0; k < n; k++) if (!hit.has(idx + k)) missed = true;
    idx += n;
    p.append(missed && n ? el('span', 'miss', tok) : tok);
  });
  return p;
}

function renderQuiz() {
  const box = $('quiz');
  if (!quiz) { box.hidden = true; return; }
  box.hidden = false;
  const q = quiz.qs[quiz.i];
  if (!q) return renderSummary();
  const head = el('div', 'quiz-head');
  head.append(el('span', 'quiz-tag' + (q.isNew ? '' : ' review'), q.isNew ? '오늘 표현' : '복습'), el('span', 'meta', '영작 체크 ' + (quiz.i + 1) + ' / ' + quiz.qs.length));
  const ko = el('p', 'quiz-ko', q.sen[1]);
  const hint = el('p', 'quiz-hint', '힌트: ' + q.ko);
  const ta = el('textarea');
  ta.id = 'quiz-input';
  ta.placeholder = '영어로 써 보세요. 키보드의 🎤 버튼으로 말해도 돼요';
  ta.setAttribute('autocapitalize', 'sentences');
  const btns = el('div', 'quiz-btns');
  const check = el('button', 'btn', '채점하기');
  check.type = 'button';
  const showExpr = el('button', 'btn ghost', '표현 보기');
  showExpr.type = 'button';
  showExpr.addEventListener('click', () => { hint.textContent = '힌트: ' + q.en + ' (' + q.ko + ')'; showExpr.remove(); });
  const skip = el('button', 'btn ghost', '모르겠어요');
  skip.type = 'button';
  btns.append(check, showExpr, skip);
  const res = el('div');
  box.replaceChildren(head, ko, hint, ta, btns, res);

  const finish = user => {
    const g = grade(q.sen[0], user);
    const pass = g.score >= 70;
    if (pass) quiz.right++;
    record(q, pass);
    const r = el('div', 'result ' + (pass ? 'pass' : 'fail'));
    r.append(el('p', 'score', (pass ? '👏 ' : '💪 ') + g.score + '점'),
      el('p', 'meta', pass ? '잘했어요! 빨간 단어만 한 번 더 확인해 보세요.' : '아깝네요. 빨간 단어를 보고 소리 내서 따라 해 보세요. 내일 다시 나와요.'));
    const line = el('div', 'answer-line');
    const say = sayBtn(q.sen[0], true);
    line.append(markAnswer(q.sen[0], g.hit), say);
    r.append(line);
    const next = el('button', 'btn', quiz.i + 1 < quiz.qs.length ? '다음 문제' : '결과 보기');
    next.type = 'button';
    next.addEventListener('click', () => { quiz.i++; renderQuiz(); });
    btns.replaceChildren(next);
    res.replaceChildren(r);
    ta.readOnly = true;
    speakList([[q.sen[0], say]]);
  };
  check.addEventListener('click', () => { if (!ta.value.trim()) { ta.focus(); return; } finish(ta.value); });
  skip.addEventListener('click', () => finish(''));
  setTimeout(() => ta.focus(), 50);
}

function record(q, pass) {
  const today = keyOf(new Date());
  const L = engData.learned = engData.learned || {};
  const x = L[q.key] || { en: q.en, ko: q.ko, ex: q.ex, field: q.field, level: q.level, first: today, box: 0 };
  if (L[q.key] && x.last === today) return;   // 같은 날 다시 풀어도 한 번만 반영
  if (pass) x.box = Math.min(5, (q.isNew && !L[q.key] ? 0 : x.box || 0) + 1);
  else x.box = 0;
  x.last = today;
  if (x.box >= 5) delete x.due; else x.due = addDays(today, REVIEW_DAYS[x.box]);
  L[q.key] = x;
}

function renderSummary() {
  const total = quiz.qs.length, right = quiz.right;
  const today = keyOf(new Date());
  engData.done[today] = true;
  saveEng();
  familyMarkMe();
  const box = $('quiz');
  const s = el('div', 'summary');
  s.append(el('p', 'big', right === total ? '🏆' : right >= total / 2 ? '🎉' : '💪'),
    el('p', 'score', total + '문제 중 ' + right + '개 통과'),
    el('p', 'meta', '오늘 도장 쾅! 틀린 표현은 내일, 맞힌 표현은 며칠 뒤에 복습으로 다시 나와요.'));
  const close = el('button', 'btn', '닫기');
  close.type = 'button';
  close.addEventListener('click', () => { quiz = null; renderQuiz(); renderEng(); });
  s.append(close);
  box.replaceChildren(s);
  renderBoard(engData, new Date());
  renderFamily(new Date());
}

/* ───────── 가족 공부 달력 ───────── */
let family = null;
function loadFamily() {
  call('getEngAll', pin).then(f => { family = f || {}; familyMarkMe(false); if (view === 'eng') renderFamily(new Date()); if (view === 'home') renderHome(); }).catch(() => {});
}
function familyMarkMe(render) {
  if (!family || !engData) return;
  const mine = new Set(family[current] || []);
  Object.keys(engData.done || {}).forEach(k => mine.add(k));
  family[current] = [...mine];
  if (render !== false && view === 'home') renderHome();
}
function familyDoneToday() {
  if (!family) return null;
  const today = keyOf(new Date());
  const names = Object.keys(PEOPLE);
  return { n: names.filter(n => (family[n] || []).includes(today)).length, total: names.length };
}
function renderFamily(now) {
  if (!$('fam-cal')) return;
  const names = Object.keys(PEOPLE);
  const sets = {};
  names.forEach(n => { sets[n] = new Set((family && family[n]) || []); });
  if (engData) Object.keys(engData.done || {}).forEach(k => sets[current].add(k));
  const today = keyOf(now);
  const y = now.getFullYear(), m = now.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  $('fam-meta').textContent = family ? (m + 1) + '월' : '불러오는 중';
  $('fam-today').replaceChildren(...names.map(n => {
    const did = sets[n].has(today);
    let count = 0, streak = 0;
    for (let d = 1; d <= days; d++) if (sets[n].has(keyOf(new Date(y, m, d)))) count++;
    const c = new Date(y, m, now.getDate());
    if (!sets[n].has(keyOf(c))) c.setDate(c.getDate() - 1);
    while (sets[n].has(keyOf(c))) { streak++; c.setDate(c.getDate() - 1); }
    const chip = el('div', 'fam-person' + (did ? '' : ' not'));
    chip.append(photo(n), el('b', '', n), (did ? ' ✓ ' : ' 아직 ') + '· ' + count + '일' + (streak > 1 ? ' 🔥' + streak : ''));
    return chip;
  }));
  const first = new Date(y, m, 1).getDay();
  const cells = ['일', '월', '화', '수', '목', '금', '토'].map(w => el('div', 'dow', w));
  for (let i = 0; i < first; i++) cells.push(el('div'));
  for (let d = 1; d <= days; d++) {
    const k = keyOf(new Date(y, m, d));
    const cls = ['fam-day'];
    if (d === now.getDate()) cls.push('today');
    if (d > now.getDate()) cls.push('future');
    const cell = el('div', cls.join(' '), d);
    const faces = el('div', 'fam-faces');
    const who = names.filter(n => sets[n].has(k));
    who.forEach(n => faces.append(photo(n)));
    cell.append(faces);
    cell.setAttribute('aria-label', d + '일 ' + (who.length ? who.join(', ') + ' 공부함' : '아무도 안 함'));
    cells.push(cell);
  }
  $('fam-cal').replaceChildren(...cells);
}

$('done-btn').addEventListener('click', startQuiz);
$('undo').addEventListener('click', () => { delete engData.done[keyOf(new Date())]; renderEng(); saveEng(); });
$('slow').addEventListener('click', () => { engData.slow = !engData.slow; renderEng(); saveEng(); });
$('hide-en').addEventListener('click', () => { engData.hideEn = !engData.hideEn; renderEng(); saveEng(); });
// 영어 가리기 중에는 문장을 누르면 그 문장만 잠깐 보인다
$('exprs').addEventListener('click', e => {
  const t = e.target.closest('.expr-en, .ex-en');
  if (t && $('exprs').classList.contains('hide-en')) t.classList.toggle('peek');
});

['post', 'chat', 'guide'].forEach(n => $('tab-' + n).addEventListener('click', () => showTab(n)));
$('chat-form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('chat-text').value.trim();

  $('chat-send').disabled = true;
  $('chat-error').textContent = '';

    await call('sendChat', pin, current, text);

    await loadChat();

    $('chat-error').textContent = '못 보냈어요. 다시 눌러 주세요.';
  } finally {
    $('chat-send').disabled = false;
  }
});
$('guide').addEventListener('input', () => { guideDirty = true; $('guide-saved').textContent = ''; });
$('guide-form').addEventListener('submit', async e => {
  e.preventDefault();
  $('guide-save').disabled = true;
  $('guide-error').textContent = '';
  try {
    await call('saveGuide', pin, current, $('guide').value);
    guideDirty = false;
    $('guide-saved').textContent = '저장했어요. 다음 글부터 반영돼요.';
  } catch (err) {
    $('guide-error').textContent = '저장하지 못했어요. 다시 눌러 주세요.';
  } finally {
    $('guide-save').disabled = false;
  }
});
$('me').addEventListener('click', () => { if (!busy) { stopSpeak(); enter(null); } });
$('home').addEventListener('click', () => { if (!busy) go('home'); });
$('back').addEventListener('click', () => { if (!busy) go('home'); });
$('photos').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
const drop = $('drop');
['dragover', 'dragenter'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
$('place').addEventListener('input', () => { $('error').textContent = ''; });
$('form').addEventListener('submit', submit);
$('pin-form').addEventListener('submit', e => {
  e.preventDefault();
  pin = $('pin').value.trim();
  try { localStorage.setItem('zz-pin', pin); } catch (err) { /* 저장 못 해도 동작 */ }
  $('pin-error').textContent = '';
  refresh();
});

renderAccounts();
refresh();
setInterval(() => { if (!busy) refresh(); }, 60000);
// 채팅 화면에서 답을 기다릴 때만 자주 확인한다
setInterval(() => { if (current && view === 'blog' && tab === 'chat' && chatWaiting) loadChat(); }, 8000);
setInterval(() => { if (current && view === 'blog' && tab === 'chat' && !chatWaiting) loadChat(); }, 60000);
